[project]
name = "ComfyUI-UsageMonitor"
description = "With this suit, you can see the resources monitor, progress bar & time elapsed, metadata and compare between two images, compare between two JSONs, show any value to console/display, pipes, and more!\nThis provides better nodes to load/save images, previews, etc, and see \"hidden\" data without loading a new workflow."
version = "1.27.4"
license = { file = "LICENSE" }
dependencies = ["torch", "nvidia-ml-py", "amdsmi", "py-cpuinfo", "psutil"]

classifiers = [
  "Operating System :: OS Independent",
  "Environment :: GPU :: NVIDIA CUDA",
  "Environment :: GPU",
]

[project.urls]
Repository = "https://github.com/576576/ComfyUI-UsageMonitor"
Documentation = "https://github.com/576576/ComfyUI-UsageMonitor/blob/main/README.md"
"Bug Tracker" = "https://github.com/576576/ComfyUI-UsageMonitor/issues"

[tool.comfy]
PublisherId = "576576"
DisplayName = "ComfyUI-UsageMonitor"
Icon = "https://raw.githubusercontent.com/576576/ComfyUI-UsageMonitor/main/docs/screwdriver.png"
