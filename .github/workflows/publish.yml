name: Release and Pub
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "version"

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == '576576' }}
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < version)
          gh release delete release-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create release-latest \
            --title "$VERSION" \
            --generate-notes

  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    needs: release
    if: ${{ github.repository_owner == '576576' }}
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: publish
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
